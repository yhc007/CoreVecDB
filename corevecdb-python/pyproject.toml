[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "corevecdb"
version = "0.1.0"
description = "CoreVecDB embedded vector database for Python"
requires-python = ">=3.9"

[tool.maturin]
features = []

[tool.maturin.environment]
PYO3_USE_ABI3_FORWARD_COMPATIBILITY = "1"
