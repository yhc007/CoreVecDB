[package]
name = "vectordb"
version = "0.1.0"
edition = "2021"

[features]
default = ["server"]
server = ["dep:axum", "dep:tower", "dep:tower-http", "dep:tonic", "dep:prost", "dep:tokio-stream", "dep:async-stream", "dep:tonic-build", "dep:protoc-bin-vendored"]

[dependencies]
# Core Logic
hnsw_rs = "0.3"
ndarray = "0.15"  # Often needed with hnsw-rs/faiss

# Storage & Persistence
sled = "0.34"
memmap2 = "0.9"

# Filtering
roaring = "0.10"

# Async runtime (needed for WAL, storage flush)
tokio = { version = "1.36", features = ["full"] }

# Networking (server feature only)
tokio-stream = { version = "0.1", optional = true }
tonic = { version = "0.11", optional = true }
prost = { version = "0.12", optional = true }
axum = { version = "0.7", optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"], optional = true }
async-stream = { version = "0.3", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = "0.3"

# Utilities
anyhow = "1.0"
lz4_flex = "0.11"  # Fast LZ4 compression
crc32fast = "1.4"
thiserror = "1.0"
parking_lot = "0.12"
rayon = "1.8"
config = "0.13"
lru = "0.16"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
rand = "0.9"

# Metrics
prometheus = "0.13"
lazy_static = "1.4"
once_cell = "1.19"

[build-dependencies]
tonic-build = { version = "0.11", optional = true }
protoc-bin-vendored = { version = "3.0", optional = true }

[[bin]]
name = "vectordb"
required-features = ["server"]

[dev-dependencies]
tempfile = "3.10"
